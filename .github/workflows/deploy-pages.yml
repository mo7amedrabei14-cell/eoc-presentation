name: Deploy EOC Presentation to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare the published presentation
        shell: bash
        run: |
          # The root deck is the source of truth. Rewrite image paths for the
          # static site served from ./deploy, while preserving the full presentation.
          sed 's#deploy/assets/#assets/#g' eoc-command-deck.html > deploy/index.html
          # Publish the same deck at the explicit URL already used by the portfolio iframe.
          sed 's#deploy/assets/#assets/#g' eoc-command-deck.html > deploy/eoc-command-deck.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload presentation files
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
