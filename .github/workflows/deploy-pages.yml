name: Deploy EOC Presentation to GitHub Pages

on:
  push:
    branches:
      - main
      - feature/github-pages-presentation-2026-10-15
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload presentation files
        uses: actions/upload-pages-artifact@v4
        with:
          # deploy/index.html and its local assets are the ready-to-publish static site.
          path: ./deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
